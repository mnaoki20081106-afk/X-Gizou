name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "build/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test fingerprint runtime
        run: node --test Tests/fingerprint-runtime.test.cjs

      - name: Test profile consistency and migration
        run: |
          swiftc XGizou/Models/BrowserProfile.swift XGizou/Services/FingerprintSpoofer.swift XGizou/Services/RemoteEnvironmentVerifier.swift Tests/profile-consistency.swift -o /tmp/xgizou-profile-tests
          /tmp/xgizou-profile-tests

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project XGizou.xcodeproj \
            -scheme XGizou \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/XGizou.app"
          test -d "$APP_PATH"
          rm -rf Payload XGizou-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/XGizou.app
          ditto -c -k --sequesterRsrc --keepParent Payload XGizou-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XGizou-unsigned-ipa
          path: XGizou-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

  remote-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: remote

    steps:
      - uses: actions/checkout@v4

      - name: Validate and start private remote browser
        run: |
          docker compose config --quiet
          docker compose up -d

      - name: Check remote control page, browser process and environment identity
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ -o /tmp/remote-index.html &&
               docker compose exec -T chromium sh -c 'pgrep -x chromium || pgrep -x chrome || pgrep -x chromium-browse' >/dev/null; then
              test -s /tmp/remote-index.html
              environment_id=$(curl --fail --silent http://127.0.0.1:3000/.well-known/xgizou-environment-id | tr -d '\r\n')
              printf '%s' "$environment_id" | grep -Eq '^[0-9a-fA-F-]{36}$'
              marker_id=$(docker compose exec -T chromium cat /config/.xgizou-environment-id | tr -d '\r\n')
              test "$environment_id" = "$marker_id"
              docker compose exec -T chromium sh -c 'printf "%s\n" "$CHROME_CLI" | grep -F -- "--app=https://x.com/"'
              docker compose exec -T chromium sh -c 'test "$SELKIES_MANUAL_WIDTH" = "393" && test "$SELKIES_MANUAL_HEIGHT" = "852"'
              docker compose exec -T chromium sh -c 'printf "%s\n" "$SELKIES_UI_SHOW_SIDEBAR" | grep -F "false"'
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100
          exit 1

      - name: Verify separate browsers, storage and identities
        run: |
          XGIZOU_HTTP_PORT=3002 docker compose -p xgizou-profile-two up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3002/ -o /tmp/remote-second.html &&
               XGIZOU_HTTP_PORT=3002 docker compose -p xgizou-profile-two exec -T chromium sh -c 'pgrep -x chromium || pgrep -x chrome || pgrep -x chromium-browse' >/dev/null; then
              break
            fi
            sleep 2
          done

          test -s /tmp/remote-second.html

          first_environment_id=$(curl --fail --silent http://127.0.0.1:3000/.well-known/xgizou-environment-id | tr -d '\r\n')
          second_environment_id=$(curl --fail --silent http://127.0.0.1:3002/.well-known/xgizou-environment-id | tr -d '\r\n')
          test -n "$first_environment_id" && test -n "$second_environment_id"
          test "$first_environment_id" != "$second_environment_id"

          first_id=$(docker compose ps -q chromium)
          second_id=$(XGIZOU_HTTP_PORT=3002 docker compose -p xgizou-profile-two ps -q chromium)
          test -n "$first_id" && test -n "$second_id" && test "$first_id" != "$second_id"

          first_volume=$(docker inspect "$first_id" --format '{{range .Mounts}}{{if eq .Destination "/config"}}{{.Name}}{{end}}{{end}}')
          second_volume=$(docker inspect "$second_id" --format '{{range .Mounts}}{{if eq .Destination "/config"}}{{.Name}}{{end}}{{end}}')
          test -n "$first_volume" && test -n "$second_volume" && test "$first_volume" != "$second_volume"

      - name: Stop temporary test browser
        if: always()
        run: |
          XGIZOU_HTTP_PORT=3002 docker compose -p xgizou-profile-two down -v
          docker compose down -v
