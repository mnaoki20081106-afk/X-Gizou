name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "build/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test fingerprint runtime
        run: node --test Tests/fingerprint-runtime.test.cjs

      - name: Test profile consistency and migration
        run: |
          swiftc XGizou/Models/BrowserProfile.swift XGizou/Services/FingerprintSpoofer.swift Tests/profile-consistency.swift -o /tmp/xgizou-profile-tests
          /tmp/xgizou-profile-tests

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild             -project XGizou.xcodeproj             -scheme XGizou             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build | tee xcodebuild.log

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/XGizou.app"
          test -d "$APP_PATH"
          rm -rf Payload XGizou-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/XGizou.app
          ditto -c -k --sequesterRsrc --keepParent Payload XGizou-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XGizou-unsigned-ipa
          path: XGizou-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

  remote-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@v4
      - name: Validate and start private remote browser
        run: |
          docker compose config --quiet
          docker compose up -d
      - name: Check remote control page and browser process
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ -o /tmp/remote-index.html && docker compose top | grep -E 'chromium|chrome' >/dev/null; then
              test -s /tmp/remote-index.html
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100
          exit 1
      - name: Stop temporary test browser
        if: always()
        run: docker compose down -v
