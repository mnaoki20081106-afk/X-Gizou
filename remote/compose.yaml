name: xgizou-remote
services:
  environment-init:
    image: alpine:3.22
    command:
      - /bin/sh
      - -ec
      - |
        marker=/config/.xgizou-environment-id
        if [ ! -s "$$marker" ]; then
          umask 077
          cat /proc/sys/kernel/random/uuid > "$$marker"
        fi
        chmod 0644 "$$marker"
        test "$$(wc -c < "$$marker")" -le 64
        grep -Eq '^[0-9a-fA-F-]{36}[[:space:]]*$' "$$marker"
    volumes:
      - browser-profile:/config
    restart: "no"

  chromium:
    image: lscr.io/linuxserver/chromium:latest
    depends_on:
      environment-init:
        condition: service_completed_successfully
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Tokyo
      LC_ALL: ja_JP.UTF-8
      CHROME_CLI: "--app=https://x.com/ --start-maximized --no-first-run --no-default-browser-check --disable-session-crashed-bubble"
      TITLE: X
      SELKIES_MANUAL_RESOLUTION: "true|locked"
      SELKIES_MANUAL_WIDTH: "393"
      SELKIES_MANUAL_HEIGHT: "852"
      SELKIES_ENABLE_RESIZE: "false|locked"
      SELKIES_SECOND_SCREEN: "false|locked"
      SELKIES_UI_TITLE: X
      SELKIES_UI_SHOW_LOGO: "false|locked"
      SELKIES_UI_SHOW_SIDEBAR: "false|locked"
      SELKIES_UI_SHOW_CORE_BUTTONS: "false|locked"
      SELKIES_UI_SIDEBAR_SHOW_KEYBOARD_BUTTON: "true|locked"
    volumes:
      - browser-profile:/config
    expose:
      - "3000"
    shm_size: "1gb"
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      environment-init:
        condition: service_completed_successfully
      chromium:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - browser-profile:/browser-profile:ro
    ports:
      - "127.0.0.1:${XGIZOU_HTTP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  browser-profile:
