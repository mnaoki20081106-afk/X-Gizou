name: xgizou-remote
services:
  chromium:
    image: lscr.io/linuxserver/chromium:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Tokyo
      LC_ALL: ja_JP.UTF-8
      CHROME_CLI: https://x.com/home
    volumes:
      - browser-profile:/config
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: "1gb"
    restart: unless-stopped
volumes:
  browser-profile:
