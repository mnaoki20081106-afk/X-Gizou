name: XGizou
options:
  bundleIdPrefix: com.xgizou
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  XGizou:
    type: application
    platform: iOS
    sources:
      - XGizou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xgizou.app
        PRODUCT_NAME: XGizou
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: X-Gizou
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
      testTargets:
        - XGizouUITests

  XGizouUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: XGizou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xgizou.app.uitests
        GENERATE_INFOPLIST_FILE: YES
